name: GitHub Contribution Graphs

on:
  # Schedule the workflow to run daily at midnight UTC
  schedule:
    - cron: "0 0 * * *"

  # Allow manual triggering of the workflow
  workflow_dispatch:

  # Trigger the workflow on pushes to the main branch
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-graphs
  cancel-in-progress: true

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate GitHub Contributions Snake Animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
            dist/sunset.gif?color_snake=%23ff6b6b&color_dots=%23fff3b0,%23ffd166,%23f4a261,%23e76f51,%23d62828
            dist/forest.gif?color_snake=%23ffffff&color_dots=%23d8f3dc,%2395d5b2,%2374c69d,%2352b788,%232d6a4f
            dist/neon.gif?color_snake=%23f72585&color_dots=%237209b7,%23560bad,%23480ca8,%233a0ca3,%233f37c9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload so the deploy job (which runs after both generators) can pick it up
      - name: Upload snake output
        uses: actions/upload-artifact@v4
        with:
          name: snake-dist
          path: dist

  generate-galaga:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Fighter jet firing lasers at your contribution grid
      - name: Generate Galaga Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'galaga'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload galaga output
        uses: actions/upload-artifact@v4
        with:
          name: galaga-dist
          path: dist

  deploy:
    needs: [generate-snake, generate-galaga]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download snake output
        uses: actions/download-artifact@v4
        with:
          name: snake-dist
          path: dist

      - name: Download galaga output
        uses: actions/download-artifact@v4
        with:
          name: galaga-dist
          path: dist

      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update contribution graphs [skip ci]"
